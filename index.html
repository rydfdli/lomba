<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Lomba 17 Agustus</title>
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .view-section { display: none; } /* Class untuk menyembunyikan halaman */
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .card-stat { border: none; border-radius: 12px; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

    <!-- ==================== VIEW: LOGIN ==================== -->
    <!-- ==================== VIEW: LOGIN ==================== -->
<div id="view-login" class="view-section active">
    <div class="vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg" style="width: 400px; border-radius: 15px; border: none;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="text-danger fw-bold">🇮🇩 SIM 17AN</h3>
                    <p class="text-muted">Login Panitia</p>
                </div>
                <form id="formLogin">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" id="btnLogin" class="btn btn-danger btn-lg w-100 fw-bold">Masuk</button>
                </form>
            </div>
        </div>
    </div>
</div>

    <!-- ==================== VIEW: MAIN APP (DASHBOARD) ==================== -->
    <div id="view-app" class="view-section">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand" href="#" onclick="switchPage('page-dashboard')">🇮🇩 SIM 17 Agustus</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item cursor-pointer"><a class="nav-link" onclick="switchPage('page-dashboard')">Dashboard</a></li>
                        <li class="nav-item cursor-pointer"><a class="nav-link" onclick="switchPage('page-peserta')">Peserta</a></li>
                        <li class="nav-item cursor-pointer"><a class="nav-link" onclick="switchPage('page-lomba')">Lomba</a></li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <span class="text-white me-3 fw-bold" id="userNameDisplay">Panitia</span>
                        <button class="btn btn-light text-danger btn-sm fw-bold" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container mt-4 pb-5">
            
            <!-- --- HALAMAN: DASHBOARD --- -->
            <div id="page-dashboard" class="page-section">
                <h3 class="mb-4 text-secondary">Dashboard</h3>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="card card-stat bg-primary text-white shadow">
                            <div class="card-body">
                                <h5>Total Peserta</h5>
                                <h2 class="fw-bold" id="statPeserta">--</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card card-stat bg-success text-white shadow">
                            <div class="card-body">
                                <h5>Lomba Tersedia</h5>
                                <h2 class="fw-bold" id="statLomba">--</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card card-stat bg-warning text-dark shadow">
                            <div class="card-body">
                                <h5>Juri Terdaftar</h5>
                                <h2 class="fw-bold" id="statJuri">--</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- --- HALAMAN: PESERTA --- -->
            <div id="page-peserta" class="page-section" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-secondary">Manajemen Peserta</h3>
                    <button class="btn btn-danger" onclick="showModalPeserta()">+ Tambah Peserta</button>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <table id="tablePeserta" class="table table-striped w-100">
                            <thead class="table-dark">
                                <tr><th>ID</th><th>Nama</th><th>Instansi/RT</th><th>No HP</th><th>Aksi</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- --- HALAMAN: LOMBA --- -->
            <div id="page-lomba" class="page-section" style="display: none;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-secondary">Manajemen Lomba</h3>
                    <button class="btn btn-danger" onclick="showModalLomba()">+ Tambah Lomba</button>
                </div>
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <table id="tableLomba" class="table table-striped w-100">
                            <thead class="table-dark">
                                <tr><th>ID</th><th>Nama Lomba</th><th>Kategori</th><th>Kuota</th><th>Aksi</th></tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ==================== MODALS ==================== -->
    <!-- Modal Peserta -->
    <div class="modal fade" id="modalPeserta" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formPeserta">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="modalPesertaTitle">Form Peserta</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="p_id">
                        <div class="mb-3"><label>Nama Lengkap</label><input type="text" class="form-control" id="p_nama" required></div>
                        <div class="mb-3"><label>Asal RT/Instansi</label><input type="text" class="form-control" id="p_instansi" required></div>
                        <div class="mb-3"><label>No HP</label><input type="number" class="form-control" id="p_hp" required></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-danger w-100" id="btnSavePeserta">Simpan</button></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Lomba -->
    <div class="modal fade" id="modalLomba" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formLomba">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="modalLombaTitle">Form Lomba</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="l_id">
                        <div class="mb-3"><label>Nama Lomba</label><input type="text" class="form-control" id="l_nama" required></div>
                        <div class="mb-3"><label>Kategori</label>
                            <select class="form-select" id="l_kategori" required>
                                <option value="">Pilih...</option><option value="Anak-anak">Anak-anak</option>
                                <option value="Ibu-ibu">Ibu-ibu</option><option value="Bapak-bapak">Bapak-bapak</option>
                                <option value="Umum">Umum</option>
                            </select>
                        </div>
                        <div class="mb-3"><label>Kuota Peserta</label><input type="number" class="form-control" id="l_kuota" required></div>
                    </div>
                    <div class="modal-footer"><button type="submit" class="btn btn-danger w-100" id="btnSaveLomba">Simpan</button></div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ==================== SCRIPT APLIKASI ==================== -->
    <script>
        // --- 1. KONFIGURASI API ---
        const API_URL = 'https://script.google.com/macros/s/AKfycbwiKhR6FLZwOfK0WVBOfkInp8Wv15T5BBGHnIp2C1FAkjd-wv0fbE9Gn_fskNgZQR306Q/exec';
        
        let dtPeserta, dtLomba;
        let bsModalPeserta, bsModalLomba;

        // --- 2. CORE API HANDLER ---
        async function apiRequest(action, method = 'GET', data = {}) {
            const token = localStorage.getItem('token') || '';
            try {
                let response;
                if(method === 'GET') {
                    response = await fetch(`${API_URL}?action=${action}&token=${token}`);
                } else {
                    const payload = { action, _method: method, token, data };
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                }
                const result = await response.json();
                
                // Cek jika token expired/invalid
                if(result.status === 'error' && result.message.includes('Unauthorized')) {
                    logout(false);
                    throw new Error('Sesi berakhir');
                }
                return result;
            } catch (err) {
                console.error("API Error:", err);
                throw err;
            }
        }

        // --- 3. INIT & AUTH ---
        $(document).ready(function() {
            bsModalPeserta = new bootstrap.Modal(document.getElementById('modalPeserta'));
            bsModalLomba = new bootstrap.Modal(document.getElementById('modalLomba'));
            
            dtPeserta = $('#tablePeserta').DataTable();
            dtLomba = $('#tableLomba').DataTable();

            checkAuth();
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                const user = JSON.parse(localStorage.getItem('user'));
                $('#userNameDisplay').text(user ? `Halo, ${user.username}` : 'Panitia');
                $('#view-login').removeClass('active');
                $('#view-app').addClass('active');
                switchPage('page-dashboard');
            } else {
                $('#view-app').removeClass('active');
                $('#view-login').addClass('active');
            }
        }

        $('#formLogin').on('submit', async function(e) {
            e.preventDefault();
            $('#btnLogin').prop('disabled', true).text('Memeriksa...');
            try {
                // Login khusus: data username/pass dikirim di root object (sesuai format GAS)
                const payload = { action: 'login', _method: 'POST', username: $('#username').val(), password: $('#password').val() };
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
                
                if (res.status === 'success') {
                    localStorage.setItem('token', res.data.token);
                    localStorage.setItem('user', JSON.stringify(res.data));
                    checkAuth();
                    Swal.fire({ icon: 'success', title: 'Login Berhasil', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'Gagal koneksi ke server', 'error');
            } finally {
                $('#btnLogin').prop('disabled', false).text('Masuk');
            }
        });

        function logout(showAlert = true) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            checkAuth();
            if(showAlert) Swal.fire({ icon: 'info', title: 'Anda telah logout', timer: 1500, showConfirmButton: false });
        }

        // --- 4. NAVIGATION (SPA) ---
        function switchPage(pageId) {
            $('.page-section').hide(); // Sembunyikan semua page
            $(`#${pageId}`).fadeIn(300); // Munculkan target page
            
            // Tutup navbar collapse di HP saat klik menu
            $('.navbar-collapse').collapse('hide');

            // Trigger load data sesuai halaman
            if (pageId === 'page-dashboard') loadDashboard();
            if (pageId === 'page-peserta') loadPeserta();
            if (pageId === 'page-lomba') loadLomba();
        }

        // --- 5. MODUL DASHBOARD ---
        async function loadDashboard() {
            try {
                const res = await apiRequest('getDashboardStats', 'GET');
                if(res.status === 'success') {
                    $('#statPeserta').text(res.data.totalPeserta || 0);
                    $('#statLomba').text(res.data.totalLomba || 0);
                    $('#statJuri').text(res.data.totalJuri || 0);
                }
            } catch(e) {}
        }

        // --- 6. MODUL PESERTA ---
        async function loadPeserta() {
            Swal.fire({ title: 'Memuat...', didOpen: () => Swal.showLoading() });
            try {
                const res = await apiRequest('getPeserta', 'GET');
                dtPeserta.clear();
                if(res.status === 'success' && res.data) {
                    res.data.forEach(p => {
                        dtPeserta.row.add([
                            p.id, p.nama, p.instansi, p.no_hp,
                            `<button class="btn btn-sm btn-warning" onclick="editPeserta('${p.id}', '${p.nama}', '${p.instansi}', '${p.no_hp}')"><i class="fas fa-edit"></i></button>
                             <button class="btn btn-sm btn-danger" onclick="hapusData('peserta', '${p.id}', loadPeserta)"><i class="fas fa-trash"></i></button>`
                        ]);
                    });
                }
                dtPeserta.draw();
                Swal.close();
            } catch (e) { Swal.close(); }
        }

        function showModalPeserta() { $('#formPeserta')[0].reset(); $('#p_id').val(''); bsModalPeserta.show(); }
        
        function editPeserta(id, nama, instansi, hp) {
            $('#p_id').val(id); $('#p_nama').val(nama); $('#p_instansi').val(instansi); $('#p_hp').val(hp);
            bsModalPeserta.show();
        }

        $('#formPeserta').on('submit', async function(e) {
            e.preventDefault();
            $('#btnSavePeserta').prop('disabled', true).text('Menyimpan...');
            const data = { id: $('#p_id').val(), nama: $('#p_nama').val(), instansi: $('#p_instansi').val(), no_hp: $('#p_hp').val() };
            try {
                const method = data.id ? 'PUT' : 'POST';
                const res = await apiRequest('peserta', method, data);
                if(res.status === 'success') {
                    bsModalPeserta.hide();
                    Swal.fire({icon: 'success', title: 'Berhasil', timer: 1500});
                    loadPeserta();
                } else Swal.fire('Error', res.message, 'error');
            } catch(e) {} finally { $('#btnSavePeserta').prop('disabled', false).text('Simpan'); }
        });

        // --- 7. MODUL LOMBA ---
        async function loadLomba() {
            Swal.fire({ title: 'Memuat...', didOpen: () => Swal.showLoading() });
            try {
                const res = await apiRequest('getLomba', 'GET');
                dtLomba.clear();
                if(res.status === 'success' && res.data) {
                    res.data.forEach(l => {
                        dtLomba.row.add([
                            l.id, l.nama_lomba, l.kategori, l.kuota,
                            `<button class="btn btn-sm btn-warning" onclick="editLomba('${l.id}', '${l.nama_lomba}', '${l.kategori}', '${l.kuota}')"><i class="fas fa-edit"></i></button>
                             <button class="btn btn-sm btn-danger" onclick="hapusData('lomba', '${l.id}', loadLomba)"><i class="fas fa-trash"></i></button>`
                        ]);
                    });
                }
                dtLomba.draw();
                Swal.close();
            } catch (e) { Swal.close(); }
        }

        function showModalLomba() { $('#formLomba')[0].reset(); $('#l_id').val(''); bsModalLomba.show(); }
        
        function editLomba(id, nama, kat, kuota) {
            $('#l_id').val(id); $('#l_nama').val(nama); $('#l_kategori').val(kat); $('#l_kuota').val(kuota);
            bsModalLomba.show();
        }

        $('#formLomba').on('submit', async function(e) {
            e.preventDefault();
            $('#btnSaveLomba').prop('disabled', true);
            const data = { id: $('#l_id').val(), nama_lomba: $('#l_nama').val(), kategori: $('#l_kategori').val(), kuota: $('#l_kuota').val() };
            try {
                const method = data.id ? 'PUT' : 'POST';
                const res = await apiRequest('lomba', method, data);
                if(res.status === 'success') {
                    bsModalLomba.hide();
                    Swal.fire({icon: 'success', title: 'Berhasil', timer: 1500});
                    loadLomba();
                } else Swal.fire('Error', res.message, 'error');
            } catch(e) {} finally { $('#btnSaveLomba').prop('disabled', false); }
        });

        // --- 8. FUNGSI HAPUS GLOBAL ---
        async function hapusData(action, id, reloadCallback) {
            const confirm = await Swal.fire({ title: 'Yakin hapus?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Hapus' });
            if(confirm.isConfirmed) {
                Swal.fire({ title: 'Menghapus...', didOpen: () => Swal.showLoading() });
                const res = await apiRequest(action, 'DELETE', { id: id });
                if(res.status === 'success') {
                    Swal.fire({icon: 'success', title: 'Terhapus', timer: 1500});
                    reloadCallback(); // Panggil ulang tabel
                } else Swal.fire('Error', res.message, 'error');
            }
        }
    </script>
</body>
</html>
