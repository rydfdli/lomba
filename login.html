<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIKDA-Link | Login Admin Puskesmas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            purple: '#5E44C2', pink: '#FF1268',
                            yellow: '#FFDF00', yellowhover: '#E6C800',
                            dark: '#0F172A'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Fredoka', 'cursive']
                    },
                    borderRadius: { '4xl': '2.25rem', '5xl': '3rem' },
                    boxShadow: {
                        'playful': '0 20px 40px -15px rgba(94, 68, 194, 0.22)',
                        'yellow-glow': '0 10px 25px -5px rgba(255, 223, 0, 0.45)'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #EFF2F9; color: #0F172A; -webkit-tap-highlight-color: transparent;}
    </style>
</head>
<body class="min-h-full flex flex-col justify-center items-center p-4 sm:p-6 relative overflow-x-hidden">

    <div class="fixed -top-24 -left-24 w-80 h-80 bg-theme-purple/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-24 -right-24 w-80 h-80 bg-theme-pink/15 rounded-full blur-3xl pointer-events-none"></div>

    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 ease-out bg-theme-dark text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10 max-w-sm">
        <i class="fa-solid fa-shield-halved text-theme-pink text-xl" id="toast-icon"></i>
        <div>
            <p id="toast-title" class="font-bold text-xs text-white">Status</p>
            <p id="toast-msg" class="text-[11px] text-gray-300">Pesan notifikasi.</p>
        </div>
    </div>

    <main class="w-full max-w-md bg-white rounded-4xl sm:rounded-5xl p-6 sm:p-10 shadow-playful border border-white/80 relative z-10">
        
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center justify-center w-16 h-16 bg-theme-purple rounded-3xl text-white shadow-playful mb-3 hover:rotate-6 transition-transform text-3xl">
                <i class="fa-solid fa-cloud-bolt text-theme-yellow"></i>
            </a>
            <h1 class="font-display text-2xl sm:text-3xl font-bold text-theme-dark">
                SIKDA<span class="text-theme-pink">.Admin</span>
            </h1>
            <p class="text-xs font-medium text-gray-400 mt-1">Sistem Kelola Dokumen Admin Tata Usaha</p>
        </div>

        <div class="mb-5 p-3 bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-between">
            <span class="text-[11px] font-bold text-gray-500 flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles text-theme-yellow"></i> Kredensial Demo:
            </span>
            <button type="button" onclick="quickFillAdmin()" class="px-3 py-1.5 bg-white hover:bg-purple-50 text-theme-purple rounded-lg text-[10px] font-bold border border-gray-200 transition-colors">
                ⚡ Isi Login Admin
            </button>
        </div>

        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold text-gray-700 mb-1.5">Username Admin</label>
                <div class="relative">
                    <i class="fa-solid fa-user-shield text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="username" required autocomplete="username"
                           class="w-full bg-gray-50 border border-gray-200 text-sm pl-11 pr-4 py-3.5 rounded-2xl focus:outline-none focus:border-theme-purple focus:bg-white transition-all font-medium"
                           placeholder="Username admin...">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-gray-700 mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                    <input type="password" id="password" required autocomplete="current-password"
                           class="w-full bg-gray-50 border border-gray-200 text-sm pl-11 pr-12 py-3.5 rounded-2xl focus:outline-none focus:border-theme-purple focus:bg-white transition-all font-medium"
                           placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-theme-yellow hover:bg-theme-yellowhover text-theme-dark font-display font-bold py-4 px-4 rounded-full text-sm shadow-yellow-glow transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 mt-2">
                <span>MASUK DASHBOARD</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-theme-pink transition-colors">
                <i class="fa-solid fa-chevron-left"></i>
                <span>Kembali ke Portal Publik</span>
            </a>
        </div>

    </main>

    <footer class="mt-6 text-center text-xs text-gray-400 font-medium z-10">
        © 2026 SIKDA-Link • Admin Panel Tata Usaha
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            quickFillAdmin();
        });

        function showToast(title, msg, isError = false) {
            const toast = document.getElementById("toast");
            document.getElementById("toast-title").innerText = title;
            document.getElementById("toast-msg").innerText = msg;
            
            const icon = document.getElementById("toast-icon");
            icon.className = isError ? "fa-solid fa-triangle-exclamation text-red-500 text-xl" : "fa-solid fa-shield-halved text-theme-pink text-xl";

            toast.classList.remove("translate-x-full");
            setTimeout(() => { toast.classList.add("translate-x-full"); }, 3000);
        }

        function quickFillAdmin() {
            document.getElementById("username").value = "admin";
            document.getElementById("password").value = "admin123";
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            const btn = document.getElementById("btn-submit");
            
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>MEMVERIFIKASI...</span>`;
            btn.disabled = true;

            const gasUrl = localStorage.getItem("sikda_gas_url");
            const sheetId = localStorage.getItem("sikda_sheet_id");

            // Attempt to login via GAS
            if (gasUrl && sheetId) {
                try {
                    const response = await fetch(gasUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "login", data: { username: u, password: p }, spreadsheetId: sheetId })
                    });
                    const res = await response.json();

                    if (res.success) {
                        if (res.user.role !== 'ADMIN') {
                            showToast("Ditolak", "Panel ini khusus untuk Administrator TU.", true);
                            resetBtn();
                            return;
                        }
                        localStorage.setItem("sikda_admin_logged", "true");
                        localStorage.setItem("sikda_user", JSON.stringify(res.user));
                        showToast("Berhasil", "Mengarahkan ke dashboard admin...");
                        setTimeout(() => window.location.href = "dashboard.html", 800);
                        return;
                    } else {
                        showToast("Gagal", res.message || "Kredensial tidak valid", true);
                        resetBtn();
                        return;
                    }
                } catch(err) {
                    console.warn("GAS Error, falling back to local auth", err);
                }
            }

            // Fallback Local Mock Auth
            setTimeout(() => {
                if (u === "admin" && p === "admin123") {
                    localStorage.setItem("sikda_admin_logged", "true");
                    showToast("Login Local", "Mengarahkan ke dashboard admin...");
                    setTimeout(() => window.location.href = "dashboard.html", 800);
                } else {
                    showToast("Login Gagal", "Username atau password admin salah!", true);
                    resetBtn();
                }
            }, 600);

            function resetBtn() {
                btn.innerHTML = `<span>MASUK DASHBOARD</span> <i class="fa-solid fa-arrow-right"></i>`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
